<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #050505; color: white; font-family: 'DM Sans', sans-serif; }
::selection { background: #c71f25; color: white; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #050505; }
::-webkit-scrollbar-thumb { background: #c71f25; border-radius: 4px; }
</style>
</helmet>

<div id="app"></div>

<script type="module">
import React from 'https://esm.sh/react@18.2.0';
import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
import { motion, AnimatePresence } from 'https://esm.sh/framer-motion@11.0.24';
import { Scissors, MapPin, Phone, Clock, Instagram, ChevronDown, Star, ArrowRight, X, Menu, Sparkles, Zap, Award } from 'https://esm.sh/lucide-react@0.468.0';

const e = React.createElement;

const red = '#c71f25';
const dark = '#050505';
const cream = '#f4ead7';

const services = [
  { title: 'COUPE', img: './assets/coupe-1.jpg', desc: 'Une coupe adaptée à ton style, précise et personnalisée.' },
  { title: 'BARBE', img: './assets/barbe-1.jpg', desc: 'Taille, contours et finitions pour une barbe parfaitement structurée.' },
  { title: 'COUPE + BARBE', img: './assets/barbe-premium.jpg', desc: 'Le combo complet pour repartir frais, net et confiant.' },
  { title: 'COIFFURE', img: './assets/coiffure.jpg', desc: 'Mise en forme et styling pour une finition impeccable.' },
  { title: 'ÉPILATION', img: './assets/epilation.jpg', desc: 'Des contours propres jusque dans les moindres détails.' },
  { title: 'TATOUAGE', img: './assets/tatouage.jpg', desc: 'Exprime ton style avec un tatouage unique réalisé sur place.' },
];

function Navbar() {
  const [open, setOpen] = React.useState(false);
  return e('nav', {
    style: {
      position: 'fixed', top: 0, left: 0, width: '100%', zIndex: 50,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '16px 6vw', background: 'rgba(5,5,5,.82)', backdropFilter: 'blur(14px)',
      borderBottom: '1px solid rgba(255,255,255,.06)'
    }
  }, [
    e('div', { key: 'logo', style: { display: 'flex', alignItems: 'center', gap: 12 } }, [
      e('img', { src: './assets/logo-barber-jaune.png', style: { width: 44, height: 44, objectFit: 'contain' } }),
      e('div', { style: { fontFamily: 'Bebas Neue', fontSize: 24, letterSpacing: 1 } }, 'BARBER FACTORY')
    ]),
    e('div', { key: 'links', className: 'desktop-links', style: { display: 'flex', gap: 28, alignItems: 'center' } }, [
      ['Accueil','#home'], ['Services','#services'], ['Le salon','#salon'], ['Contact','#contact']
    ].map(([label, href]) => e('a', { key: label, href, style: { color: 'white', textDecoration: 'none', fontSize: 14, fontWeight: 600 } }, label))),
    e('a', { key: 'cta', href: '#contact', className: 'nav-cta', style: { background: red, color: 'white', textDecoration: 'none', padding: '11px 18px', borderRadius: 999, fontWeight: 700, fontSize: 14 } }, 'PRENDRE RDV'),
    e('button', { key: 'menu', onClick: () => setOpen(!open), className: 'mobile-menu', style: { display: 'none', background: 'transparent', border: 0, color: 'white' } }, e(Menu, { size: 26 })),
    open && e('div', { key: 'drawer', style: { position: 'absolute', top: '100%', left: 0, width: '100%', background: '#080808', padding: 24, display: 'grid', gap: 18, borderTop: '1px solid #222' } }, [
      ['Accueil','#home'], ['Services','#services'], ['Le salon','#salon'], ['Contact','#contact']
    ].map(([label, href]) => e('a', { key: label, href, onClick:()=>setOpen(false), style: { color:'white', textDecoration:'none', fontSize:18, fontWeight:700 } }, label)))
  ]);
}

function Hero() {
  return e('section', { id: 'home', style: { minHeight: '100vh', position: 'relative', display: 'flex', alignItems: 'center', overflow: 'hidden' } }, [
    e('img', { key: 'bg', src: './assets/a_propos.jpg', style: { position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', filter:'brightness(.34)' } }),
    e('div', { key: 'overlay', style:{ position:'absolute', inset:0, background:'linear-gradient(90deg, rgba(5,5,5,.95) 0%, rgba(5,5,5,.72) 45%, rgba(5,5,5,.15) 100%)' } }),
    e('div', { key:'content', style:{ position:'relative', zIndex:2, width:'100%', maxWidth:1280, margin:'0 auto', padding:'130px 6vw 80px' } }, [
      e(motion.div, { initial:{opacity:0,y:20}, animate:{opacity:1,y:0}, transition:{duration:.6}, style:{ display:'inline-flex', alignItems:'center', gap:8, color:'#f0c75e', fontWeight:700, fontSize:13, letterSpacing:2, marginBottom:20 } }, [e(Sparkles,{size:16}), 'BARBER SHOP · ALBI']),
      e(motion.h1, { initial:{opacity:0,y:28}, animate:{opacity:1,y:0}, transition:{duration:.7,delay:.08}, style:{ fontFamily:'Bebas Neue', fontSize:'clamp(70px,12vw,170px)', lineHeight:.78, margin:0, letterSpacing:-2 } }, [
        'TON STYLE.', e('br',{key:'b'}), e('span',{key:'s',style:{color:red}},'NOTRE SIGNATURE.')
      ]),
      e(motion.p, { initial:{opacity:0,y:22}, animate:{opacity:1,y:0}, transition:{duration:.7,delay:.18}, style:{ maxWidth:590, fontSize:'clamp(17px,2vw,22px)', lineHeight:1.55, color:'rgba(255,255,255,.78)', margin:'28px 0 34px' } }, 'Plus qu’une coupe. Une expérience complète pensée pour ceux qui veulent ressortir avec confiance.'),
      e(motion.div, { initial:{opacity:0,y:18}, animate:{opacity:1,y:0}, transition:{duration:.7,delay:.28}, style:{display:'flex',gap:14,flexWrap:'wrap'} }, [
        e('a',{href:'#contact',style:{background:red,color:'white',textDecoration:'none',padding:'15px 24px',borderRadius:999,fontWeight:800,display:'inline-flex',alignItems:'center',gap:10}},['PRENDRE RENDEZ-VOUS',e(ArrowRight,{size:18,key:'i'})]),
        e('a',{href:'#services',style:{border:'1px solid rgba(255,255,255,.25)',color:'white',textDecoration:'none',padding:'15px 24px',borderRadius:999,fontWeight:700}},'DÉCOUVRIR NOS SERVICES')
      ])
    ]),
    e('div',{key:'scroll',style:{position:'absolute',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:3,opacity:.65}},e(ChevronDown,{size:28}))
  ]);
}

function SectionTitle({eyebrow,title,sub}) {
  return e('div',{style:{maxWidth:760,marginBottom:48}},[
    e('div',{key:'e',style:{color:red,fontWeight:800,fontSize:12,letterSpacing:2.4,marginBottom:12}},eyebrow),
    e('h2',{key:'t',style:{fontFamily:'Bebas Neue',fontSize:'clamp(48px,7vw,86px)',lineHeight:.95,margin:'0 0 18px'}},title),
    sub && e('p',{key:'s',style:{color:'rgba(255,255,255,.62)',fontSize:18,lineHeight:1.6,margin:0}},sub)
  ]);
}

function Services() {
  return e('section',{id:'services',style:{padding:'110px 6vw',background:'#0a0a0a'}},[
    e(SectionTitle,{key:'title',eyebrow:'NOS PRESTATIONS',title:'TOUT CE QU’IL FAUT POUR ÊTRE NET.',sub:'Des prestations pensées pour ton style, ton visage et ton quotidien.'}),
    e('div',{key:'grid',style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:18}},services.map((s,i)=>
      e(motion.div,{key:s.title,whileHover:{y:-6},transition:{duration:.25},style:{position:'relative',minHeight:410,borderRadius:24,overflow:'hidden',background:'#111'}},[
        e('img',{key:'img',src:s.img,style:{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',filter:'brightness(.58)'}}),
        e('div',{key:'g',style:{position:'absolute',inset:0,background:'linear-gradient(180deg,transparent 20%,rgba(0,0,0,.92) 100%)'}}),
        e('div',{key:'c',style:{position:'absolute',left:24,right:24,bottom:24}},[
          e('div',{key:'n',style:{fontFamily:'Bebas Neue',fontSize:44,lineHeight:1}},s.title),
          e('p',{key:'d',style:{color:'rgba(255,255,255,.7)',margin:'8px 0 0',lineHeight:1.5}},s.desc)
        ])
      ])
    ))
  ]);
}

function Experience() {
  return e('section',{id:'salon',style:{padding:'110px 6vw',background:cream,color:'#111'}},[
    e('div',{key:'layout',style:{display:'grid',gridTemplateColumns:'1.05fr .95fr',gap:'6vw',alignItems:'center'}},[
      e('div',{key:'visual',style:{position:'relative'}},[
        e('img',{src:'./assets/equipe-action.webp',style:{width:'100%',height:620,objectFit:'cover',borderRadius:28,display:'block'}}),
        e('div',{style:{position:'absolute',right:-26,bottom:-26,background:red,color:'white',padding:'26px 30px',borderRadius:24,maxWidth:260}},[
          e(Award,{size:32,key:'i'}),
          e('div',{key:'t',style:{fontFamily:'Bebas Neue',fontSize:30,marginTop:12}},'UNE VRAIE EXPÉRIENCE'),
          e('div',{key:'d',style:{opacity:.8,lineHeight:1.5}},'Du détail, de la précision et une ambiance à part.')
        ])
      ]),
      e('div',{key:'copy'},[
        e('div',{style:{color:red,fontWeight:800,fontSize:12,letterSpacing:2.4,marginBottom:14}},'BARBER FACTORY ALBI'),
        e('h2',{style:{fontFamily:'Bebas Neue',fontSize:'clamp(50px,7vw,90px)',lineHeight:.9,margin:'0 0 24px'}},'UN SALON OÙ TU VIENS POUR PLUS QU’UNE COUPE.'),
        e('p',{style:{fontSize:18,lineHeight:1.7,color:'#4f4f4f'}},'Chez Barber Factory, chaque passage est pensé comme un moment à part. Une équipe passionnée, des gestes précis et une vraie attention portée au résultat.'),
        e('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginTop:30}},[
          ['01','PRÉCISION'],['02','STYLE'],['03','AMBIANCE']
        ].map(([n,t])=>e('div',{key:t,style:{borderTop:'1px solid #bbb',paddingTop:14}},[
          e('div',{style:{fontSize:12,color:red,fontWeight:800}},n),e('div',{style:{fontFamily:'Bebas Neue',fontSize:26,marginTop:4}},t)
        ])))
      ])
    ])
  ]);
}

function Gallery() {
  const imgs=['./assets/coupe-2.jpg','./assets/coupe-3.jpg','./assets/barbe-2.jpg','./assets/barbe-3.jpg'];
  return e('section',{style:{padding:'110px 6vw',background:'#080808'}},[
    e(SectionTitle,{key:'t',eyebrow:'LE RÉSULTAT PARLE',title:'DES DÉTAILS QUI FONT LA DIFFÉRENCE.'}),
    e('div',{key:'g',style:{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gridTemplateRows:'260px 260px',gap:14}},[
      e('img',{key:'a',src:imgs[0],style:{gridRow:'1 / 3',width:'100%',height:'100%',objectFit:'cover',borderRadius:22}}),
      e('img',{key:'b',src:imgs[1],style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:22}}),
      e('img',{key:'c',src:imgs[2],style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:22}}),
      e('img',{key:'d',src:imgs[3],style:{gridColumn:'2 / 4',width:'100%',height:'100%',objectFit:'cover',borderRadius:22}}),
    ])
  ]);
}

function Contact() {
  return e('section',{id:'contact',style:{padding:'110px 6vw',background:red}},[
    e('div',{key:'wrap',style:{maxWidth:1200,margin:'0 auto',display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:'6vw',alignItems:'start'}},[
      e('div',{key:'l'},[
        e('div',{style:{fontWeight:800,fontSize:12,letterSpacing:2.4,opacity:.8,marginBottom:14}},'PRÊT À PASSER À LA FACTORY ?'),
        e('h2',{style:{fontFamily:'Bebas Neue',fontSize:'clamp(64px,9vw,120px)',lineHeight:.82,margin:'0 0 24px'}},'PRENDS TA PLACE. ON S’OCCUPE DU RESTE.'),
        e('p',{style:{fontSize:19,lineHeight:1.6,maxWidth:570,opacity:.82}},'Passe au salon ou contacte-nous pour ton prochain rendez-vous.')
      ]),
      e('div',{key:'r',style:{background:'#070707',borderRadius:26,padding:30}},[
        [MapPin,'Albi, France'],[Phone,'Contacte le salon'],[Clock,'Horaires disponibles sur Google']
        ].map(([Icon,text])=>e('div',{key:text,style:{display:'flex',gap:14,alignItems:'center',padding:'18px 0',borderBottom:'1px solid #222'}},[
          e('div',{style:{width:44,height:44,borderRadius:14,background:'#181818',display:'grid',placeItems:'center',color:red}},e(Icon,{size:20})),
          e('div',{style:{fontWeight:700}},text)
        ])),
        e('a',{href:'https://www.instagram.com/',target:'_blank',style:{marginTop:22,display:'flex',alignItems:'center',justifyContent:'center',gap:10,background:'white',color:'#111',textDecoration:'none',padding:'14px 18px',borderRadius:999,fontWeight:800}},[e(Instagram,{size:20,key:'i'}),'NOUS SUIVRE SUR INSTAGRAM'])
      ])
    ])
  ]);
}

function Footer(){
  return e('footer',{style:{padding:'26px 6vw',background:'#050505',borderTop:'1px solid #171717',display:'flex',justifyContent:'space-between',gap:20,flexWrap:'wrap',fontSize:13,color:'rgba(255,255,255,.48)'}},[
    e('div',{key:'a'},'© Barber Factory Albi'),e('div',{key:'b'},'Style · Précision · Expérience')
  ]);
}

function App(){
  return e(React.Fragment,null,[
    e(Navbar,{key:'nav'}), e(Hero,{key:'hero'}), e(Services,{key:'services'}), e(Experience,{key:'exp'}), e(Gallery,{key:'gal'}), e(Contact,{key:'contact'}), e(Footer,{key:'footer'}),
    e('style',{key:'css'},`
      @media (max-width: 900px){
        .desktop-links,.nav-cta{display:none!important}.mobile-menu{display:block!important}
        #services>div:last-child{grid-template-columns:1fr 1fr!important}
        #salon>div{grid-template-columns:1fr!important}
        #contact>div{grid-template-columns:1fr!important}
      }
      @media (max-width: 640px){
        #services{padding-top:80px!important;padding-bottom:80px!important}
        #services>div:last-child{grid-template-columns:1fr!important}
        #salon{padding:80px 20px!important}
        #salon img{height:450px!important}
        section{overflow:hidden}
      }
    `})
  ]);
}

createRoot(document.getElementById('app')).render(e(App));
</script>
</x-dc>
</body>
</html>
